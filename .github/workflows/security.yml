name: Security CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: ruff check .
      - run: pytest --cov=app --cov-fail-under=90 -q
      - name: Audit OpenAPI contract
        run: python -m scripts.audit_openapi --output reports/openapi-audit.json
      - name: Upload OpenAPI audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-audit
          path: reports/openapi-audit.json
          retention-days: 30

  sast:
    name: SAST — Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Generate Bandit report
        run: bandit --recursive app scripts --format json --output bandit-report.json --exit-zero
      - name: Apply SAST gate
        run: python scripts/security_gate.py --bandit bandit-report.json

  dependencies:
    name: Dependencies — Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  dast:
    name: DAST passivo — OWASP ZAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Start application
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          cat /tmp/uvicorn.log
          exit 1
      - name: Run passive scan
        run: |
          mkdir -p reports
          chmod 0777 reports
          docker run --rm --network host \
            --volume "${{ github.workspace }}/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-baseline.py -t http://127.0.0.1:8000/docs \
            -J zap-report.json -r zap-report.html -w zap-report.md -I
      - name: Apply DAST gate
        run: python scripts/security_gate.py --zap reports/zap-report.json
      - name: Upload ZAP evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-passive-report
          path: |
            reports/zap-report.json
            reports/zap-report.html
            reports/zap-report.md
          if-no-files-found: error
          retention-days: 30

  security-gate:
    name: Security gate
    if: always()
    needs: [tests, sast, dependencies, dast]
    runs-on: ubuntu-latest
    steps:
      - name: Block merge when any required control fails
        env:
          TESTS: ${{ needs.tests.result }}
          SAST: ${{ needs.sast.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          DAST: ${{ needs.dast.result }}
        run: |
          test "$TESTS" = success
          test "$SAST" = success
          test "$DEPENDENCIES" = success
          test "$DAST" = success
